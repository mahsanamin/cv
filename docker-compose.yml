services:
  cv-website:
    build: .
    container_name: ahsan-cv
    ports:
      - "9090:9090"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: ahsan-cv-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - cv-website
    restart: unless-stopped
    profiles:
      - production
    environment:
      - NGINX_PORT=80
      - UPSTREAM_PORT=9090
